# Current Config for B4 learned adaptive R_theta, per-sample NLL

seed: 42

scenario:
  dt: 0.1
  n_steps: 100  # steps per trajectory
  n_trajectories: 10000 # 100 to start for debugging, but increase to 10000 once up and running
  sigma_range: 100.0  # matches prior scripts
  sigma_bearing: 0.01
  epsilon: 0.1  # contaminated Gaussian mixture weight
  kappa: 10.0 # contaminated Gaussian variance scale

dataset:
  window: 10  # W, number of past and current raw measurements per input
  val_fraction: 0.2  # held out by trajectory, not timestep

model:
  hidden_channels: 32
  n_layers: 4 # dilated conv layers (receptive field must cover window)
  kernel_size: 3
  dim_z: 2 # For RadarRangeBearing (EOIR only has 1; just bearing)
  dim_pos: 2
training:
  batch_size: 64
  epochs: 40
  learning_rate: 1.0e-3
  grad_clip_norm: 1.0

comparison:
  mc_trials: 30

covariance:
  sigma_scale: 20.0  # multiplies the softplus output so L starts near the measured ~21 m error
  min_diag: 1.0e-3  # floor added so L never goes singular
  checkpoint_path: data/processed/adaptive_checkpoint.pt

# Tuned alpha on tuning_seeds (not used in the comparison trials)
baseline:
  alpha_grid: [1.0, 1.5, 2.0, 3.0, 4.0, 6.0, 8.0]
  tuning_seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020]
  best_alpha: 3.8763  # found via tune_baseline_alpha.py
