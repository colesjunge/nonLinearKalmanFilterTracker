# Config for IMM baseline (classical answer to maneuvering targets)

dt: 0.1
sigma_pos: 5.0

initialization:
  P0: [[400.0, 0.0, 0.0, 0.0],
       [0.0, 430.0, 0.0, 0.0],
       [0.0, 0.0, 370.0, 0.0],
       [0.0, 0.0, 0.0, 800.0]]  # matches training.yaml's initialization P0

modes:
  # These values were found via tune_maneuver_baseline.py
  # omega = median |angular rate| over turning steps in the tuning trajectories
  # (sigma_a found via brentq against NEES=4 on straight-only (cv) and turning-only (ct) steps
  cv:
    sigma_a: 28.758722290341623
  ct_plus:
    omega: 2.5720236001745045
    sigma_a: 83.43547142902904
  ct_minus:
    omega: -2.5720236001745045
    sigma_a: 83.43547142902904

# Rows = previous mode, columns = destination mode (chosen by me for now)
transition_matrix: [[0.96, 0.02, 0.02],
                     [0.02, 0.96, 0.02],
                     [0.02, 0.02, 0.96]]

mode_probs0: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]

# Tuned sigma_a on tuning_seeds (not used in the comparison trials)
tuning:
  sigma_a_grid: [0.1, 0.5, 1, 5, 10, 50, 100, 500, 1000, 2000]
  tuning_seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020]
cv_baseline:
  sigma_a: 39.807465882640216  # found via tune_maneuver_baseline.py

# Disjoint from tuning_seeds
comparison:
  mc_seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
             2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019,
             2020, 2021, 2022, 2023, 2024, 2025, 2026, 2027, 2028, 2029]

