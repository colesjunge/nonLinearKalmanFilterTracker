# Config for final comparison matrix

dt: 0.1
n_steps: 100

tuning_seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009,
               1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020]

comparison:
  mc_seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
             2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019,
             2020, 2021, 2022, 2023, 2024, 2025, 2026, 2027, 2028, 2029]

initialization:
  P0: [[400.0, 0.0, 0.0, 0.0],
       [0.0, 430.0, 0.0, 0.0],
       [0.0, 0.0, 370.0, 0.0],
       [0.0, 0.0, 0.0, 800.0]]
  # Bearing-only has no range in z, so x0's position guess is only ever a point
  # picked along the bearing ray at a generic default range (see
  # scenarios.bearing_only.default_range_guess) -- position variance here must
  # cover the true 0-180m sensor-to-target spread (spawn region [-100,100]^2,
  # sensor at [20,35]), not the smaller spread the other scenarios' radar-inverted
  # x0 already handles. Velocity variance left matching the global P0 above --
  # speed 5-30 m/s is already well covered at 1 sigma.
  P0_bearing: [[3600.0, 0.0, 0.0, 0.0],
               [0.0, 3600.0, 0.0, 0.0],
               [0.0, 0.0, 370.0, 0.0],
               [0.0, 0.0, 0.0, 800.0]]

scenarios:

  benign:
    sigma_range: 20.0
    sigma_bearing: 0.01
    methods: [EKF, UKF]
    sigma_a_grid: [0.1, 0.5, 1, 5, 10, 50, 100, 500, 1000]

  maneuvering:
    sigma_range: 20.0
    sigma_bearing: 0.01
    turn_prob: 0.4
    leg_duration_range: [0.1, 0.5]
    omega_range: [0, 5]
    methods: [EKF, UKF, IMM]  # EKF/UKF here = CV motion model, no turn-awareness; IMM is the turn-aware comparison
    sigma_a_grid: [0.1, 0.5, 1, 5, 10, 50, 100, 500, 1000, 2000]
    # Markov mode-switch hyperparameters for the IMM row -- not measurement-model-dependent,
    # reused as-is from configs/imm.yaml (Stage 12). IMM's three mode-filters must use
    # ExtendedKalmanFilter + RadarRangeBearing here (not imm.yaml's KalmanFilter + LinearPosition2D),
    # to match this column's EKF/UKF rows on the same nonlinear sensor.
    transition_matrix: [[0.96, 0.02, 0.02],
                         [0.02, 0.96, 0.02],
                         [0.02, 0.02, 0.96]]
    mode_probs0: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]

  contaminated:
    sigma_range: 20.0
    sigma_bearing: 0.01
    epsilon: 0.1
    kappa: 10.0
    methods: [EKF, UKF]
    sigma_a_grid: [0.1, 0.5, 1, 5, 10, 50, 100, 500, 1000]

  bearing_only:
    sigma_bearing: 0.01
    sensor_pos: [20.0, 35.0]  # matches demo_sequential_fusion.py's EOIR geometry
    epsilon: 0.1
    kappa: 10.0
    default_range_guess: 100.0  # x0_filter is seeded on the bearing ray at this range; P0_bearing's huge position variance absorbs how wrong this guess is
    methods: [EKF, UKF]
    sigma_a_grid: [0.1, 0.5, 1, 5, 10, 50, 100, 500, 1000]

  dual_sensor_fusion:
    sigma_range: 20.0
    sigma_bearing: 0.01
    radar_pos: [0.0, 0.0]      # matches demo_sequential_fusion.py (RadarRangeBearing defaults to origin)
    eoir_pos: [20.0, 35.0]     # matches demo_sequential_fusion.py
    # 6 table rows, but only 4 tuned sigma_a values: naive and CI reuse
    # track_level's sigma_a (same two independently-run tracks, different
    # fusion math only); sequential is a genuinely different filter (one
    # object, two updates per step) and gets its own.
    methods:
      sequential: [EKF, UKF]
      track_level: [EKF, UKF]   # shared by both fuse_naive and covariance_intersection
    sigma_a_grid: [0.1, 0.5, 1, 5, 10, 50, 100, 500, 1000]

  heavy_clutter:
    # Sensor/noise params reused exactly from configs/training.yaml's clutter block --
    # NOT this file's sigma_range: 20.0 used by every other scenario above. The trained
    # classifier's features (squared Mahalanobis distance, etc.) were computed under
    # sigma_range=100.0 radar noise; changing it here would silently feed the classifier
    # an out-of-distribution feature scale it was never calibrated against. Not comparable
    # to the other scenarios' sigma_range as a raw number anyway -- this scenario's spawn
    # region is [-5000,5000]^2 vs benign's [-100,100]^2, so 100.0 here is ~1-2% of a typical
    # range (more precise relatively than benign's 20.0/~10-20%), not less.
    sigma_range: 100.0
    sigma_bearing: 0.01
    p_detect: 0.9
    clutter_rate: 3.0
    range_max: 10000.0
    bearing_range: [-3.141592653589793, 3.141592653589793]
    n_targets: 3
    gate_confidence: 0.99
    spawn_region: [-5000.0, 5000.0, -5000.0, 5000.0]
    speed_range: [10.0, 30.0]
    # Settled by Stage 11's sweep_birth_threshold.py -- not re-tuned here, since this
    # column has no NEES target to tune against (scored on id_switches/false_track_rate
    # instead, per the Stage 13 checkpoint).
    birth_threshold: 0.3
    match_gate: 300.0  # 3 * sigma_range, matching run_clutter_comparison.py's convention
    methods: [EKF, UKF]

tuned:
  # Filled in by tune_benign.py
  benign:
    EKF: 12.525803771515495
    UKF: 1.5824095654047916
  # Filled in by tune_maneuvering.py
  maneuvering:
    EKF: 41.46085564065797
    UKF: 42.715311386770004
    modes:
      cv: 31.89720488088903
      ct_plus: 79.05173355984762
      ct_minus: 401.82066209219937
    omega: 2.8389837680632013
  # Filled in by tune_contaminated.py
  contaminated:
    EKF: 4.920872059510148
    UKF: null # See tune_contaminated.py for why
  # Filled in by tune_bearing_only.py
  bearing_only:
    EKF: 634.404541978951
    UKF: 0.6631614438565597
  # Filled in by tune_dual_sensor_fusion.py
  dual_sensor_fusion:
    sequential:
      EKF: 168.91741803063607
      UKF: 1.3053760171426958
    # Tuned by CI not naive
    track_level:
      EKF: 40.41685703456618
      UKF: 8.52044722532766
